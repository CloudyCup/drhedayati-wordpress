name: Acceptance (Docker WordPress)

# Runs the disposable local Docker WordPress integration/acceptance suite
# (docker/ + scripts/ + docker/wp-tests/, see docs/LOCAL_TESTING.md) on a
# Linux GitHub-hosted runner.
#
# Guarantees, by construction of this workflow (not just the harness it calls):
#   - Never deploys anywhere. There is no deploy/publish/release step here.
#   - Never contacts mystik.ir or drhedayati.com. Every service in
#     docker/docker-compose.yml is a container on the runner's own loopback
#     network; the only network calls this job makes are pulling public
#     Docker Hub images (mysql, wordpress, wordpress:cli) and checking out
#     this repository. No secrets, tokens or credentials are used.
#   - Uses only synthetic local data. The suite (docker/wp-tests/) only ever
#     creates/reads/deletes data it namespaces itself (hdit_* users,
#     _hdit_synthetic posts) inside a database that lives only in this job's
#     ephemeral containers and is destroyed at the end regardless of outcome.
#
# Triggers (docs/PHASE_2D_PLANNING.md §11): every push to main (catches merges,
# including fast-forward/squash merges that don't go through a PR), every pull
# request targeting main (so a new feature branch gets Docker acceptance signal
# without editing this file per phase), plus an explicit manual run.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: acceptance-docker-wordpress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Phase 2A + 2B + 2C runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker / Compose versions
        run: |
          docker --version
          docker compose version

      - name: Run Phase 2A + 2B acceptance suite
        id: acceptance
        shell: bash
        run: |
          chmod +x scripts/*.sh
          # bash's default GitHub Actions invocation is `bash --noprofile --norc -eo pipefail`,
          # so `tee`'s exit status does not mask run-acceptance.sh's real exit code.
          ./scripts/run-acceptance.sh 2>&1 | tee acceptance.log

      - name: Summarize result
        if: always()
        shell: bash
        run: |
          {
            echo "### Acceptance suite result"
            echo
            if [ "${{ steps.acceptance.outcome }}" = "success" ]; then
              echo ":white_check_mark: **PASS** — every assertion passed and cleanup was verified."
            else
              echo ":x: **FAIL** — see the failing assertions / fatal error below and the uploaded logs artifact."
            fi
            echo
            echo '```'
            grep -E "preflight:|ACCEPTANCE TOTAL:|^RESULT:|RESULT:|\[FAIL\]|\[FATAL\]|FAILED CHECKS:" acceptance.log || tail -n 40 acceptance.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p test-logs
          cp acceptance.log test-logs/acceptance.log 2>/dev/null || true
          docker compose -f docker/docker-compose.yml logs --no-color > test-logs/compose.log 2>&1 || true
          docker compose -f docker/docker-compose.yml run --rm --no-deps -T --entrypoint sh wpcli \
            -c 'cat /var/www/html/wp-content/debug.log 2>/dev/null || echo "(no debug.log)"' \
            > test-logs/wp-debug.log 2>&1 || true

      - name: Upload test logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs-${{ github.run_id }}
          path: test-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down (always — disposable containers + volumes only)
        if: always()
        shell: bash
        run: ./scripts/env-down.sh || true
