# Disposable local WordPress integration-test environment for drhedayati-wordpress.
#
# This simulates the mystik.ir staging backend closely enough to run automated
# Phase 2A + Phase 2B integration/acceptance tests WITHOUT touching the
# Iran-restricted staging domain. It is NOT a deployment target — see
# docs/LOCAL_TESTING.md.
#
# Everything here is throwaway: `docker compose down -v` erases all state.

name: hedayati-localtest

services:
  # ── MySQL 8, utf8mb4 (matches staging) ────────────────────────────────────
  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: "${WP_DB_NAME:-hedayati_wp}"
      MYSQL_USER: "${WP_DB_USER:-hedayati}"
      MYSQL_PASSWORD: "${WP_DB_PASSWORD:-hedayati_local_only}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_local_only}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_local_only}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── WordPress + PHP 8.3 (Apache) ──────────────────────────────────────────
  wordpress:
    image: wordpress:6.6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_HOST_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${WP_DB_NAME:-hedayati_wp}"
      WORDPRESS_DB_USER: "${WP_DB_USER:-hedayati}"
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD:-hedayati_local_only}"
      WORDPRESS_TABLE_PREFIX: "${WP_TABLE_PREFIX:-mystik_}"
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    volumes:
      - wp_core:/var/www/html
      - ../plugin/hedayati-core:/var/www/html/wp-content/plugins/hedayati-core
      - ../theme/hedayati:/var/www/html/wp-content/themes/hedayati

  # ── WP-CLI (same core volume, same DB) ────────────────────────────────────
  wpcli:
    build:
      context: .
      dockerfile: Dockerfile.wpcli
    image: hedayati-localtest-wpcli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${WP_DB_NAME:-hedayati_wp}"
      WORDPRESS_DB_USER: "${WP_DB_USER:-hedayati}"
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD:-hedayati_local_only}"
      WORDPRESS_TABLE_PREFIX: "${WP_TABLE_PREFIX:-mystik_}"
    # www-data in the Debian-based WordPress image is uid/gid 33; match it so
    # files created by WP-CLI stay readable/writable by Apache and vice versa.
    user: "33:33"
    working_dir: /var/www/html
    volumes:
      - wp_core:/var/www/html
      - ../plugin/hedayati-core:/var/www/html/wp-content/plugins/hedayati-core
      - ../theme/hedayati:/var/www/html/wp-content/themes/hedayati
      - ./wp-tests:/wp-tests:ro
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  wp_core:
  db_data:
